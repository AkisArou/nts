[package]
name = "nts-react"
description = "The React lane's compiler stage: TSX through the upstream Rust React Compiler, with its output typed again, into a project nts builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nts-react"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
nts-frontend-ts.workspace = true
nts-semantic-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
# The upstream Rust React Compiler, pinned to the commit the lane's
# conformance tests run at (runtime/react/upstream-compile/upstream.lock.json).
# Moving this `rev` is moving the pin, and the parity harness is what says the
# move is safe.
react_compiler = { git = "https://github.com/facebook/react", rev = "1d34f91dfde6bba84d08b683aaba164c7194dacb" }
react_compiler_ast = { git = "https://github.com/facebook/react", rev = "1d34f91dfde6bba84d08b683aaba164c7194dacb" }

[lints]
workspace = true
