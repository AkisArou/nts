<!doctype html>
<meta charset="utf-8">
<title>V8 kernels benchmark</title>
<style>
body { font: 14px system-ui; padding: 16px; }
#benchmark-result::after { content: attr(data-state); }
</style>
<h1>Kernels: ordinary page JavaScript</h1>
<p>native-typescript's benchmarks/chromium/pages/v8.js kernels, unchanged, with normal V8 JIT.</p>
<label><input type="checkbox" id="v8-kernels-run"> Run kernels</label>
<output id="benchmark-result" data-state="initializing"></output>
<canvas id="kernel-canvas" width="256" height="256"></canvas>
<script>
// Ordinary application source, loaded by the HTML parser. CDP only supplies
// input and reads results; it does not evaluate the measured application.
function createElements(count) {
  let checksum = 0;
  for (let index = 0; index < count; index += 1) {
    document.createElement("div");
    checksum += 1;
  }
  return checksum;
}

function createDetachedCounterTrees(count) {
  let checksum = 0;
  for (let index = 0; index < count; index += 1) {
    const button = document.createElement("button");
    const label = document.createTextNode("Count: 0");
    button.appendChild(label);
    label.data = "Count: 1";
    checksum += 1;
  }
  return checksum;
}

function runSynchronousEventRoundTrips(count) {
  const button = document.body;
  let checksum = 0;
  const listener = () => {
    checksum += 1;
  };
  button.addEventListener("click", listener);
  for (let index = 0; index < count; index += 1) {
    button.click();
  }
  button.removeEventListener("click", listener);
  return checksum;
}

function fillCanvasRects(count) {
  const ctx = document.getElementById('kernel-canvas').getContext('2d');
  for (let index = 0; index < count; index += 1) ctx.fillRect(index & 255, (index >> 8) & 255, 2, 2);
  return count;
}

// The same table as kernels_benchmark.cc: 20,000 iterations per sample,
// three discarded, twenty kept, one posted task per sample. `per-call` calls
// the kernel with 1 from a loop, as native-typescript's v8.js does. Canvas
// adds batch shapes -- the kernel called with N from a loop, one function
// entry per N iterations -- and `task-call`: one posted task per iteration,
// the entry a real callback pays (a task per iteration is 2,000 iterations,
// not 20,000, or the queue itself would take minutes). Fitting time
// against batch size separates an entry's cost from a call's, on both
// sides of the comparison.
const iterations = 20000, warm = 3, measured = 20, taskIterations = 2000;
const kernels = [['create-element', createElements], ['detached-counter-tree', createDetachedCounterTrees],
  ['event-round-trip', runSynchronousEventRoundTrips], ['canvas-rects', fillCanvasRects]];
const shapesOf = kernel => kernel === 'canvas-rects'
  ? [['loop', iterations], ['per-call', 1], ['batch16', 16], ['batch256', 256], ['task-call', 1]]
  : [['loop', iterations], ['per-call', 1]];
function nextTask() {
  return new Promise(resolve => {
    const channel = new MessageChannel();
    channel.port1.onmessage = () => {
      channel.port1.close();
      resolve();
    };
    channel.port2.postMessage(null);
  });
}
const output = document.querySelector('#benchmark-result');
document.querySelector('#v8-kernels-run').addEventListener('input', async () => {
  const samples = [];
  for (const [kernel, run] of kernels) {
    for (const [shape, batch] of shapesOf(kernel)) {
      const total = shape === 'task-call' ? taskIterations : iterations;
      for (let round = 0; round < warm + measured; ++round) {
        await nextTask();
        let checksum = 0;
        const start = performance.now();
        if (shape === 'task-call') {
          // One posted task per iteration, the kernel called with 1 from
          // the task's callback: the sample's elapsed time is the tasks'
          // entries and the calls together, as a page driving one call
          // per task pays them.
          checksum = await new Promise(resolve => {
            const channel = new MessageChannel();
            let left = total, sum = 0;
            channel.port1.onmessage = () => {
              sum += run(1);
              if (--left === 0) { channel.port1.close(); resolve(sum); }
              else channel.port2.postMessage(null);
            };
            channel.port2.postMessage(null);
          });
        } else {
          for (let done = 0; done < total; done += batch) checksum += run(Math.min(batch, total - done));
        }
        const elapsedNs = (performance.now() - start) * 1e6;
        if (checksum !== total) throw Error(`${kernel} checksum ${checksum}`);
        if (round < warm) continue;
        samples.push({kernel, shape, lane: 'v8', round: round - warm, iterations: total, nsPerOperation: elapsedNs / total});
      }
    }
  }
  output.setAttribute('data-result', JSON.stringify({samples, status: 0,
    timing: 'Ordinary page script; performance.now around each sample; one posted task per sample'}));
  output.setAttribute('data-state', 'done');
});
output.setAttribute('data-state', 'ready');
</script>
