[package]
name = "nts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nts"
path = "src/main.rs"

[dependencies]
nts-build.workspace = true
nts-codegen-c.workspace = true
nts-codegen-jvm.workspace = true
nts-jvm-emitter.workspace = true
rustc-hash.workspace = true
nts-codegen-llvm.workspace = true
nts-codegen-napi.workspace = true
nts-core.workspace = true
nts-deps.workspace = true
nts-differential.workspace = true
nts-debug-lowering.workspace = true
nts-diagnostics.workspace = true
nts-frontend-ts.workspace = true
nts-memory-lowering.workspace = true
nts-semantic-schema.workspace = true

anyhow.workspace = true
# `nts bind` reads clang's JSON AST. Already a workspace dependency, which is
# the reason that tool shells out to clang rather than linking libclang.
serde_json.workspace = true
# `nts bind-objc` streams clang's dump of a whole framework, 388 MB for
# AppKit, through a seed that keeps only the classes asked for.
serde.workspace = true
# `nts bind-gir` reads GObject-introspection XML.
roxmltree.workspace = true
camino.workspace = true

[dev-dependencies]
# `tsgo::locate`, so an end-to-end test can skip when the frontend is absent
# rather than fail for a reason that is not the compiler's.
nts-frontend-ts.workspace = true
# The same SHA-256 the build pins an artifact with, so a test that builds a jar
# to depend on computes the pin the way the thing under test will read it.
nts-build.workspace = true

[lints]
workspace = true
