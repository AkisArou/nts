<!doctype html>
<meta charset="utf-8">
<title>NTS native DOM counter</title>
<style>
  body { font: 20px system-ui; background: #f4f6f7; color: #17242d; padding: 64px; }
  main, section { padding: 24px; border: 1px solid #d1dadf; border-radius: 12px; margin-bottom: 16px; }
  input { width: 28px; height: 28px; vertical-align: middle; margin-right: 12px; }
</style>
<main id="native-dom-start">
  <h1>Native DOM counter</h1>
  <label><input id="native-increment" type="checkbox">Increment</label>
</main>
<!-- NTS creates the counter nodes; there is no application script. -->
<script>
const body = document.body;
const container = document.createElement('section'); container.id = 'native-dom';
const label = document.createElement('output'); label.id = 'native-dom-count';
const text = document.createTextNode('Count: 0');
label.appendChild(text); container.appendChild(label); body.appendChild(container);
window.domWitness = (() => {
  if (document.querySelector('#native-dom-count') !== label) return 1;
  if (document.querySelector('#native-dom-count') !== label) return 2;
  if (document.querySelector('#missing') !== null) return 3;
  for (const [op, code] of [
    [() => document.querySelector('['), 12],
    [() => container.appendChild(container), 3],
    [() => body.removeChild(label), 8],
    [() => document.createElement('bad name'), 5],
  ]) {
    try { op(); return code; } catch (e) { if (e.code !== code) return code; }
  }
  const exact = "A\0\u00e9\u03a9\ud800Z\udc00\ud83d\ude00";
  label.textContent = exact;
  if (label.textContent !== exact) return 8;
  label.setAttribute('data-exact', exact);
  label.className = 'counter';
  if (label.className !== 'counter') return 9;
  container.removeChild(label);
  gc();
  if (document.querySelector('#native-dom-count') !== null) return 9;
  if (label.textContent !== exact) return 10;
  container.appendChild(label);
  if (document.querySelector('#native-dom-count') !== label) return 11;
  label.textContent = 'Count: 0';
  return 0;
})();
requestAnimationFrame((time) => label.setAttribute('data-frame', time > 0 ? 'ran' : 'no time'));
cancelAnimationFrame(requestAnimationFrame(() => label.setAttribute('data-cancelled', 'ran')));
let count = 0;
document.querySelector('#native-increment').addEventListener('input', () => { label.textContent = 'Count: ' + ++count; });
</script>
