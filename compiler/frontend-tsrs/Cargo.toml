[package]
name = "nts-frontend-tsrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Transitional until tsrs is the only frontend. The switch deletes this gate
# and folds native checks into ordinary workspace Clippy and tests.
tsrs = ["dep:tsrs_ast", "dep:tsrs_compiler", "dep:tsrs_core", "dep:tsrs_diagnostics", "dep:tsrs_scanner", "dep:tsrs_tsoptions", "dep:tsrs_vfs"]

[dependencies]
camino.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
tsrs_ast = { path = "../../third_party/tsrs/crates/tsrs_ast", optional = true }
tsrs_compiler = { path = "../../third_party/tsrs/crates/tsrs_compiler", optional = true }
tsrs_core = { path = "../../third_party/tsrs/crates/tsrs_core", optional = true }
tsrs_diagnostics = { path = "../../third_party/tsrs/crates/tsrs_diagnostics", optional = true }
tsrs_scanner = { path = "../../third_party/tsrs/crates/tsrs_scanner", optional = true }
tsrs_tsoptions = { path = "../../third_party/tsrs/crates/tsrs_tsoptions", optional = true }
tsrs_vfs = { path = "../../third_party/tsrs/crates/tsrs_vfs", optional = true }

[build-dependencies]
xxhash-rust.workspace = true

# Owning tsrs programs requires their documented unsafe freeing operation.
# Keep every other workspace lint; each unsafe operation must justify its
# local expectation, and an unreviewed one still fails strict Clippy.
[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
