[package]
name = "nts-react"
description = "The React lane's compiler stage: TSX through the upstream Rust React Compiler, its output typed again and its JSX lowered, as source nts builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nts-react"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
camino.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
nts-diagnostics.workspace = true
nts-frontend-ts.workspace = true
nts-semantic-schema.workspace = true
# The upstream Rust React Compiler, vendored verbatim at the revision the
# lane's conformance tests run at (third_party/react-compiler/UPSTREAM.md).
react_compiler.workspace = true
react_compiler_ast.workspace = true
react_compiler_diagnostics.workspace = true

[lints]
workspace = true
