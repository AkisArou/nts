[workspace]
resolver = "3"
members = [
    "compiler/diagnostics",
    "compiler/semantic-schema",
    "compiler/frontend-ts",
    "compiler/core",
    "compiler/memory-lowering",
    "compiler/debug-lowering",
    "compiler/codegen/common",
    "compiler/codegen/c",
    "compiler/codegen/llvm",
    "compiler/codegen/jvm",
    "compiler/codegen/napi",
    "compiler/jvm-emitter",
    "build",
    "tooling/cli",
    "tooling/deps",
    "tooling/bench",
    "tooling/differential",
    "tooling/suite",
    "runtime/react/compiler/nts-react",
]
# The React Compiler's crates, vendored verbatim: their own workspace, used by
# path (see third_party/react-compiler/UPSTREAM.md).
exclude = ["third_party/react-compiler"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/AkisArou/nts"
publish = false

[workspace.dependencies]
# Internal crates. Kept here so a version or path move happens in one place.
nts-build = { path = "build" }
nts-codegen-c = { path = "compiler/codegen/c" }
nts-codegen-jvm = { path = "compiler/codegen/jvm" }
nts-codegen-llvm = { path = "compiler/codegen/llvm" }
nts-codegen-napi = { path = "compiler/codegen/napi" }
nts-codegen-common = { path = "compiler/codegen/common" }
nts-core = { path = "compiler/core" }
nts-deps = { path = "tooling/deps" }
nts-differential = { path = "tooling/differential" }
nts-debug-lowering = { path = "compiler/debug-lowering" }
nts-diagnostics = { path = "compiler/diagnostics" }
nts-frontend-ts = { path = "compiler/frontend-ts" }
nts-jvm-emitter = { path = "compiler/jvm-emitter" }
nts-memory-lowering = { path = "compiler/memory-lowering" }
nts-react = { path = "runtime/react/compiler/nts-react" }
nts-semantic-schema = { path = "compiler/semantic-schema" }
# The React Compiler, vendored at third_party/react-compiler.
react_compiler = { path = "third_party/react-compiler/crates/react_compiler" }
react_compiler_ast = { path = "third_party/react-compiler/crates/react_compiler_ast" }
react_compiler_diagnostics = { path = "third_party/react-compiler/crates/react_compiler_diagnostics" }

# External. Deliberately small; every addition is a maintenance obligation.
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
codespan-reporting = "0.12"
indexmap = { version = "2", features = ["serde"] }
postcard = { version = "1", features = ["use-std"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `nts bind-gir` reads GObject-introspection XML: a read-only tree, which is
# all a one-pass reader of a file the build never writes needs. Its one
# dependency, `memchr`, is already in the lock.
roxmltree = "0.21"
# `nts bind-winmd` reads ECMA-335 metadata (`Windows.Win32.winmd`) with
# Microsoft's own reader, the one windows-rs is built on. No dependencies of
# its own, and used by `tooling/cli` only, as `roxmltree` is.
windows-metadata = "0.100"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
# The IR, analysis, and codegen layers have no business containing unsafe.
# Crates that genuinely need it opt out locally with a documented reason.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Pedantic minus the noise that fights domain vocabulary.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# These are real bugs in a compiler, not style.
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# A compiler is unusable in debug builds if its dependencies are too.
[profile.dev.package."*"]
opt-level = 2
