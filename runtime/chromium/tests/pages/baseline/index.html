  <meta charset="utf-8">
  <title>NTS Chromium baseline</title>
  <style>
    body { margin: 48px; color: #18232a; background: #f4f6f7; font: 18px sans-serif; }
    main { max-width: 640px; }
    button { padding: 12px 24px; border: 0; border-radius: 6px; background: #176c45; color: white; font: inherit; }
    output { display: block; margin-top: 24px; }
  </style>
  <main>
    <h1>Chromium content baseline</h1>
    <p>This fixture executes JavaScript in V8. The native renderer experiment follows this baseline.</p>
    <button id="increment" type="button">Increment</button>
    <output id="count">Count: 0</output>
  </main>
  <script>
    let count = 0;
    document.querySelector('#increment').addEventListener('click', () => {
      document.querySelector('#count').textContent = `Count: ${++count}`;
    });
  </script>
</html>
