[package]
name = "nts-frontend-tsrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
camino.workspace = true
nts-semantic-schema = { workspace = true }
rustc-hash.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true
tsrs_ast = { path = "../../third_party/tsrs/crates/tsrs_ast" }
tsrs_checker = { path = "../../third_party/tsrs/crates/tsrs_checker" }
tsrs_compiler = { path = "../../third_party/tsrs/crates/tsrs_compiler" }
tsrs_core = { path = "../../third_party/tsrs/crates/tsrs_core" }
tsrs_diagnostics = { path = "../../third_party/tsrs/crates/tsrs_diagnostics" }
tsrs_scanner = { path = "../../third_party/tsrs/crates/tsrs_scanner" }
tsrs_tsoptions = { path = "../../third_party/tsrs/crates/tsrs_tsoptions" }
tsrs_vfs = { path = "../../third_party/tsrs/crates/tsrs_vfs" }

[build-dependencies]
serde_json.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Owning tsrs programs requires their documented unsafe freeing operation.
# Keep every other workspace lint; each unsafe operation must justify its
# local expectation, and an unreviewed one still fails strict Clippy.
[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
