<!doctype html>
<meta charset="utf-8">
<title>NTS native DOM counter</title>
<style>
  body { font: 20px system-ui; background: #f4f6f7; color: #17242d; padding: 64px; }
  main, section { padding: 24px; border: 1px solid #d1dadf; border-radius: 12px; margin-bottom: 16px; }
  input { width: 28px; height: 28px; vertical-align: middle; margin-right: 12px; }
</style>
<main id="native-dom-start">
  <h1>Native DOM counter</h1>
  <label><input id="native-increment" type="checkbox">Increment</label>
</main>
<!-- NTS creates the counter nodes; there is no application script. -->
