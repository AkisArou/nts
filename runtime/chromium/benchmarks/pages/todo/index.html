<!doctype html>
<meta charset="utf-8">
<title>NTS TodoMVC benchmark</title>
<style>
body { font: 16px system-ui; background: #f5f5f5; color: #111; margin: 0; padding: 24px; }
#benchmark-result::after { content: attr(data-state); }
.todoapp { background: #fff; width: 550px; margin: 24px auto; box-shadow: 0 2px 4px rgb(0 0 0 / 20%); }
.todoapp h1 { font-size: 64px; font-weight: 200; text-align: center; color: #b83f45; margin: 0; }
.new-todo { width: 100%; box-sizing: border-box; font-size: 24px; padding: 16px 16px 16px 60px; border: none; }
.main { position: relative; border-top: 1px solid #e6e6e6; }
.toggle-all { position: absolute; top: -40px; left: 12px; }
.todo-list { margin: 0; padding: 0; list-style: none; }
.todo-list li { position: relative; font-size: 24px; border-bottom: 1px solid #ededed; }
.todo-list li .view { display: flex; align-items: center; padding: 12px; gap: 12px; }
.todo-list li label { flex: 1; word-break: break-all; transition: color 0.4s; }
.todo-list li.completed label { color: #949494; text-decoration: line-through; }
.todo-list li .destroy { width: 32px; height: 32px; border: none; background: none; color: #949494; }
.todo-list li .destroy::after { content: "\00d7"; }
.footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; color: #111; border-top: 1px solid #e6e6e6; }
.filters { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; }
.filters button { border: 1px solid transparent; border-radius: 3px; background: none; padding: 3px 7px; }
.filters button.selected { border-color: #ce4646; }
[hidden] { display: none !important; }
</style>
<h1>TodoMVC: compiled TypeScript on the DOM generated from Blink's IDL</h1>
<p>Driven by real input events. Application scripts: zero.</p>
<output id="benchmark-result" data-state="initializing"></output>
<section class="todoapp" id="native-todo"></section>
